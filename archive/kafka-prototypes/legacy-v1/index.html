<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Systems X-Ray：用交互式 2D 漫游看见 Kafka、Redis、Elasticsearch、JVM、Spring Boot 与 Kubernetes 的内部原理。"
    />
    <title>Systems X-Ray · Kafka 消息内部漫游</title>
    <link rel="icon" href="../../../assets/brand-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#learning-stage">跳到学习画布</a>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <circle cx="16" cy="6" r="3"></circle>
              <circle cx="7" cy="16" r="3"></circle>
              <circle cx="25" cy="16" r="3"></circle>
              <circle cx="16" cy="26" r="3"></circle>
              <path d="M14 8.5 9.2 13M18 8.5l4.8 4.5M9.5 18.5l4.3 5M22.5 18.5l-4.3 5"></path>
            </svg>
          </span>
          <div>
            <strong>Systems X-Ray</strong>
            <span>Kafka · 一条消息的内部漫游</span>
          </div>
        </div>

        <div class="journey-status" aria-label="当前追踪消息">
          <span class="status-dot" aria-hidden="true"></span>
          正在追踪 <code>Message #A1024</code>
        </div>
      </header>

      <main class="learning-layout">
        <nav class="lesson-rail" aria-label="学习章节">
          <div class="rail-heading">
            <span>CHAPTER 01</span>
            <strong>消息的旅程</strong>
          </div>
          <div id="lesson-list" class="lesson-list"></div>
        </nav>

        <section class="stage-column" aria-label="Kafka 动态学习区域">
          <div class="stage-heading">
            <div>
              <span id="step-kicker" class="stage-kicker">00 · KAFKA OVERVIEW</span>
              <h1 id="step-title">先看懂 Kafka 全貌</h1>
            </div>
            <div class="mode-switch" role="group" aria-label="学习视角">
              <button id="overview-mode" type="button" aria-pressed="true">全景</button>
              <button id="detail-mode" type="button" aria-pressed="false">透视</button>
            </div>
          </div>

          <div id="learning-stage" class="learning-stage" tabindex="-1">
            <div id="world-map" class="world-map" aria-label="消息全局路径"></div>
            <div id="scene" class="scene" aria-live="polite"></div>
          </div>

          <div class="transport" aria-label="播放控制">
            <button id="previous-step" class="icon-button" type="button" aria-label="上一步">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>
            </button>
            <button id="play-step" class="play-button" type="button" aria-label="播放">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z"></path></svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"></path></svg>
            </button>
            <button id="next-step" class="icon-button" type="button" aria-label="下一步">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
            </button>

            <label class="timeline-label" for="timeline">
              <span id="timeline-text">全景总览</span>
              <input id="timeline" type="range" min="0" max="9" value="0" step="1" />
            </label>

            <label class="speed-control" for="speed">
              <span>速度</span>
              <select id="speed">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2×</option>
              </select>
            </label>
          </div>
        </section>

        <aside class="inspector" aria-label="步骤解释">
          <div class="inspector-tabs" role="tablist" aria-label="解释维度">
            <button type="button" role="tab" data-panel="principle" aria-selected="true">原理</button>
            <button type="button" role="tab" data-panel="data" aria-selected="false">数据</button>
            <button type="button" role="tab" data-panel="config" aria-selected="false">配置</button>
          </div>
          <div id="inspector-content" class="inspector-content"></div>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
