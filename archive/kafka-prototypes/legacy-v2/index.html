<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Systems X-Ray：沿着一条 Event 的真实执行时间线，从多个技术视角学习 Kafka 内部原理。"
    />
    <title>Systems X-Ray · Kafka Event Journey</title>
    <link rel="icon" href="../../../assets/brand-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#xray-stage">跳到 X-Ray 舞台</a>

    <header class="site-header">
      <a class="brand" href="#" aria-label="Systems X-Ray 首页">
        <span class="brand-symbol" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <circle cx="16" cy="6" r="3"></circle>
            <circle cx="7" cy="16" r="3"></circle>
            <circle cx="25" cy="16" r="3"></circle>
            <circle cx="16" cy="26" r="3"></circle>
            <path d="M14 8.5 9.2 13M18 8.5l4.8 4.5M9.5 18.5l4.3 5M22.5 18.5l-4.3 5"></path>
          </svg>
        </span>
        <span>
          <strong>Systems X-Ray</strong>
          <small>看见系统内部正在发生什么</small>
        </span>
      </a>

      <div class="track-identity" aria-label="当前学习轨道">
        <span>Kafka</span>
        <i aria-hidden="true">/</i>
        <strong>Event Journey</strong>
      </div>

      <div class="event-identity" aria-label="正在追踪的事件">
        <i aria-hidden="true"></i>
        <span>追踪中</span>
        <code>#A1024</code>
      </div>
    </header>

    <main class="course-shell">
      <section class="lesson-heading" aria-labelledby="step-title">
        <div class="heading-copy">
          <span id="step-kicker">STEP 01 · BUSINESS</span>
          <h1 id="step-title">业务代码创建 OrderCreated</h1>
          <p id="step-summary">一切从 JVM 中的普通业务对象开始，此时 Kafka 还不知道它的存在。</p>
        </div>

        <label class="step-picker" for="step-select">
          <span>当前步骤</span>
          <select id="step-select" aria-label="选择旅程步骤"></select>
        </label>
      </section>

      <nav id="zone-track" class="zone-track" aria-label="Event 全局旅程"></nav>

      <section class="lens-section" aria-labelledby="lens-label">
        <div class="lens-copy">
          <span id="lens-label">观察视角</span>
          <small>时间不变，切换镜头</small>
        </div>
        <div id="lens-list" class="lens-list" role="tablist" aria-label="选择观察视角"></div>
      </section>

      <section id="xray-stage" class="xray-theater" tabindex="-1" aria-label="Event X-Ray 舞台">
        <div class="theater-status">
          <div class="event-form">
            <span>EVENT 当前形态</span>
            <strong id="event-form">OrderCreated 对象</strong>
          </div>
          <div class="view-indicator">
            <span id="lens-dot" aria-hidden="true"></span>
            <strong id="current-lens">全局视角</strong>
          </div>
        </div>

        <div id="scene" class="scene" aria-live="polite"></div>

        <div class="transport" aria-label="Event 时间线控制">
          <button id="previous-step" class="round-control" type="button" aria-label="上一步">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>
          </button>
          <button id="play-step" class="play-control" type="button" aria-label="播放旅程">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z"></path></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"></path></svg>
          </button>
          <button id="next-step" class="round-control" type="button" aria-label="下一步">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
          </button>

          <label class="timeline" for="timeline">
            <span><strong id="timeline-label">01</strong><small id="timeline-total">/ 16</small></span>
            <input id="timeline" type="range" min="0" max="15" value="0" step="1" />
          </label>

          <label class="speed" for="speed-select">
            <span>速度</span>
            <select id="speed-select">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
      </section>

      <section class="step-explanation" aria-label="本步解释">
        <div class="io-flow">
          <div>
            <span>输入</span>
            <strong id="input-state">用户完成支付</strong>
          </div>
          <i aria-hidden="true">→</i>
          <div class="is-action">
            <span>当前动作</span>
            <strong id="action-state">创建领域事件</strong>
          </div>
          <i aria-hidden="true">→</i>
          <div>
            <span>输出</span>
            <strong id="output-state">OrderCreated 对象</strong>
          </div>
        </div>

        <div class="memory-note">
          <span>记住这一点</span>
          <p id="memory-note">Kafka 的旅程不是从 Broker 开始，而是从业务对象及其语义开始。</p>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
